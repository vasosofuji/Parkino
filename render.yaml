services:
  - type: web
    name: parkino-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run typecheck && npm test
    startCommand: npm run api
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_TRUST_INPUTS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_FILE
        value: certs/supabase-ca.crt
      - key: ALLOWED_ORIGINS
        value: https://vasojevich.com,http://localhost:8081,http://127.0.0.1:8081
      - key: TRUSTED_PROXIES
        value: loopback,uniquelocal
